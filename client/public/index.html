<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f6fed" />
    <title>GIFTKART — Buy Gift Cards Online in India | Amazon, Steam, PlayStation, Netflix & More</title>
    <meta
      name="description"
      content="Buy digital gift cards online in India for Amazon, Steam, PlayStation, Xbox, Netflix, Flipkart, Google Play, Swiggy, Domino's & PayPal. Instant delivery, UPI & USDT accepted."
    />
    <meta name="robots" content="index, follow" />
    <!-- There is deliberately no canonical link tag and no og:url meta in this
         file. CRA serves this one file for every route, so a hardcoded
         canonical pointing at the homepage appeared on /brand/steam, on every
         /blog/ post and everything else — telling Google those URLs were all
         duplicates of the homepage, which is why nothing but the homepage
         could get indexed. With the tag absent, Google self-canonicalises to
         the URL it actually requested. scripts/prerender-seo.js writes an
         explicit canonical into the per-route HTML it generates at build time,
         and components/Seo.jsx still sets the right one once React has run.
         Keep this comment free of real tag syntax — the prerender script
         pattern-matches the built HTML. -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GIFTKART" />
    <meta property="og:title" content="GIFTKART — Buy Gift Cards Online in India" />
    <meta
      property="og:description"
      content="Amazon, Steam, PlayStation, Netflix and more — instant digital delivery, UPI & USDT accepted."
    />
    <meta property="og:image" content="https://giftkartstore.in/images/hero-banner.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preconnect + fully non-blocking font load. A plain stylesheet <link>
         still blocks first paint, and on a throttled mobile connection that
         third-party round trip was costing several hundred ms of FCP. The
         media="print" trick lets the browser fetch it at low priority without
         blocking, then onload promotes it to all media. font-display=swap keeps
         text visible in the fallback face meanwhile. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>

    <!-- Preload the homepage LCP hero (light theme, first slide) so it starts
         downloading immediately instead of after React renders. Matches the
         <picture> breakpoints so only the right variant is fetched. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-payments.webp"
      type="image/webp"
      fetchpriority="high"
      media="(min-width: 769px)"
    />
    <link
      rel="preload"
      as="image"
      href="/images/hero-payments-mobile.webp"
      type="image/webp"
      fetchpriority="high"
      media="(max-width: 768px)"
    />

    <!-- Razorpay Checkout is deliberately NOT loaded here any more. It was a
         few hundred KB of third-party JS on every page view, including for
         visitors who never reach checkout — the biggest mobile-only cost on the
         site. services/paymentService.js now injects it on demand and the
         payment page warms it on mount, so window.Razorpay is ready well before
         anyone can press Pay. -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
