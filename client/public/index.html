<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f6fed" />
    <title>GIFTKART — Buy Gift Cards Online in India | Amazon, Steam, PlayStation, Netflix & More</title>
    <meta
      name="description"
      content="Buy digital gift cards online in India for Amazon, Steam, PlayStation, Xbox, Netflix, Flipkart, Google Play, Swiggy, Domino's & PayPal. Instant delivery, UPI & USDT accepted."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://giftkartstore.in/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GIFTKART" />
    <meta property="og:title" content="GIFTKART — Buy Gift Cards Online in India" />
    <meta
      property="og:description"
      content="Amazon, Steam, PlayStation, Netflix and more — instant digital delivery, UPI & USDT accepted."
    />
    <meta property="og:image" content="https://giftkartstore.in/images/hero-banner.png" />
    <meta property="og:url" content="https://giftkartstore.in/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preconnect + non-blocking font load (replaces the blocking @import
         that used to sit in theme.css). font-display:swap keeps text visible
         while the webfont downloads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    />

    <!-- Preload the homepage LCP hero (light theme, first slide) so it starts
         downloading immediately instead of after React renders. Matches the
         <picture> breakpoints so only the right variant is fetched. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-payments.webp"
      type="image/webp"
      fetchpriority="high"
      media="(min-width: 769px)"
    />
    <link
      rel="preload"
      as="image"
      href="/images/hero-payments-mobile.webp"
      type="image/webp"
      fetchpriority="high"
      media="(max-width: 768px)"
    />

    <!-- Razorpay Checkout SDK. `defer` takes it off the render-blocking path;
         it still defines window.Razorpay well before any checkout click. -->
    <script defer src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
